name: CI

# Standalone build of this plug-in, outside the Rodin-Bundle reactor.  In the
# bundle the Rodin bundles it compiles against are reactor artifacts; on their
# own they have to come from a published p2 site, which is what the root POM's
# `standalone-rodin` profile is for.  It contributes ${rodinTargetSiteUrl} as a
# repository whenever that property is set, so passing the property is all it
# takes to switch resolution over.

on:
  push:
    branches: [rossi]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The 3.10 child site, not the core-updates composite root: the published
  # composite has not been regenerated for this release and still lists 3.9.
  RODIN_SITE: https://rodin-b-sharp.sourceforge.net/core-updates/3.10/

jobs:
  build:
    name: Build against the published Rodin site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache the local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # No ~/.m2/toolchains.xml, unlike the bundle build: the maven-toolchains
      # requirement comes from rodincore's org.eventb.parent, and this reactor
      # has no parent POM.
      #
      # version-suffix lands in the OSGi qualifier after the build timestamp,
      # giving the same yyyyMMddHHmm-<sha> shape the Rodin site publishes.
      - name: Build
        run: |
          mvn -B clean verify \
            -DrodinTargetSiteUrl="$RODIN_SITE" \
            -Dversion-suffix="-$(git rev-parse --short HEAD)"

      # Built here to prove the site module still assembles; the update site
      # users install from is a separate module in the bundle, which
      # republishes the features out of the reactor.  Uploading this one makes
      # a pull request inspectable without a local Tycho.
      - name: Upload the update site
        uses: actions/upload-artifact@v7
        with:
          name: update-site
          path: org.eventb.rossi.bridge.site/target/repository
          if-no-files-found: error
